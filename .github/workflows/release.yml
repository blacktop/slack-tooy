name: Release slack-tooy

on:
  push:
    tags:
      - v*

permissions: {}

concurrency:
  group: ${{ github.workflow }}-homebrew-tap
  cancel-in-progress: false

jobs:
  intel:
    name: Verify native Intel build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26-intel
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install build tools
        run: brew install just xcodegen
      - name: Set up Rust stable
        run: |
          rustup update stable
          rustup default stable
      - name: Check and build on Intel
        run: |
          just check
          just build
  release:
    name: Publish slack-tooy and Homebrew cask
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: intel
    runs-on: macos-26
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install build and validation tools
        run: brew install just xcodegen actionlint
      - name: Set up Rust stable
        run: |
          rustup update stable
          rustup default stable
      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      - name: Validate release version and configuration
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          just verify-release-tag "$RELEASE_TAG"
          just release-check
          just check
      - name: Publish release archives and Homebrew cask
        run: just release-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
